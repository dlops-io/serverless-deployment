<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Translate · AC215</title>
  <style>
    :root {color-scheme:dark; --base:#1e1e2e; --mantle:#181825; --surface:#313244;
           --border:#45475a; --text:#cdd6f4; --muted:#bac2de; --accent:#cba6f7; --focus:#89b4fa;}
    body {font: 17px system-ui, sans-serif; color:var(--text); background:var(--base); margin:0;}
    main {max-width:1000px; margin:7vh auto; padding:24px;}
    h1 {font-size:2.4rem; margin-bottom:.3em;} p {line-height:1.5;}
    .panels {display:grid; grid-template-columns:1fr 1fr; gap:20px; margin:28px 0 20px;}
    section {background:var(--mantle); border:1px solid var(--border); border-radius:12px; padding:20px;}
    label {display:block; font-weight:600; margin-bottom:10px;}
    select {width:100%; margin-bottom:16px; padding:10px; font:inherit; color:var(--text);
            background:var(--surface); border:1px solid var(--border); border-radius:6px;}
    textarea {width:100%; height:210px; box-sizing:border-box; resize:vertical; border:1px solid var(--border);
              background:var(--base); color:var(--text); border-radius:6px; padding:12px; font:inherit; line-height:1.5;}
    textarea::placeholder {color:#a6adc8;}
    select:focus-visible, textarea:focus-visible, button:focus-visible {outline:2px solid var(--focus); outline-offset:3px;}
    button {font:inherit; padding:11px 20px; border:0; border-radius:7px; background:var(--accent); color:var(--base); cursor:pointer;}
    button:hover:not(:disabled) {background:#b4befe;}
    button:disabled {background:var(--surface); color:#a6adc8; cursor:default;} #status {min-height:1.5em; color:#a6e3a1;}
    .small {font-size:.9rem; color:var(--muted);} @media(max-width:650px){.panels{grid-template-columns:1fr;}}
  </style>
</head>
<body>
<main>
  <p class="small">AC215 · Serverless deployment</p>
  <h1>Translate</h1>
  <p>A small application, ready to move from localhost to Cloud Run.</p>
  <form id="translation-form">
    <div class="panels">
      <section>
        <label for="source-language">From</label>
        <select id="source-language">{% for code, name in languages.items() %}<option value="{{code}}" {% if code == 'en' %}selected{% endif %}>{{name}}</option>{% endfor %}</select>
        <label for="source-text">Your text</label>
        <textarea id="source-text" required maxlength="5000" placeholder="Enter text to translate">Good afternoon everyone</textarea>
      </section>
      <section>
        <label for="destination-language">To</label>
        <select id="destination-language">{% for code, name in languages.items() %}<option value="{{code}}" {% if code == 'fr' %}selected{% endif %}>{{name}}</option>{% endfor %}</select>
        <label for="translated-text">Translation</label>
        <textarea id="translated-text" readonly placeholder="Your translation will appear here"></textarea>
      </section>
    </div>
    <button id="translate-button" type="submit">Translate</button>
    <button type="button" disabled title="Part 3 is not implemented yet">Play audio · coming in part 3</button>
    <p id="status" role="status" aria-live="polite"></p>
  </form>
  <p class="small">Translation uses an external provider. Speech and batch output are planned extensions.</p>
</main>
<script>
  const form = document.getElementById('translation-form');
  const button = document.getElementById('translate-button');
  const status = document.getElementById('status');
  const output = document.getElementById('translated-text');
  form.addEventListener('submit', async (event) => {
    event.preventDefault(); button.disabled = true; output.value = ''; status.textContent = 'Translating…';
    try {
      const response = await fetch('/api/translate', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({text: document.getElementById('source-text').value,
          src: document.getElementById('source-language').value,
          dest: document.getElementById('destination-language').value})
      });
      const result = await response.json();
      if (!response.ok) throw new Error(result.error || 'Translation failed.');
      output.value = result.text; status.textContent = 'Translation complete.';
    } catch (error) {status.textContent = error.message;}
    finally {button.disabled = false;}
  });
</script>
</body>
</html>
