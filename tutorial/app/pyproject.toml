[project]
name = "ac215-translation-demo"
version = "0.1.0"
description = "Development scaffold for a four-part serverless tutorial"
requires-python = ">=3.12,<3.13"
dependencies = [
    "flask>=3.1,<4",
    "googletrans==4.0.0rc1",
    "gunicorn>=23,<27",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
translation_demo = ["templates/*.html"]

[tool.setuptools.packages.find]
include = ["translation_demo*"]
